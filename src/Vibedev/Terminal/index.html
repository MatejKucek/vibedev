<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"><link rel="stylesheet" href="vendor/xterm.css"><style>
html,body { margin:0; width:100%; height:100%; background:#18181b; overflow:hidden; }
#terminal { position:absolute; inset:10px 12px; }
.xterm-viewport { scrollbar-color:#42424b #18181b; scrollbar-width:thin; }
</style></head><body><div id="terminal"></div><script src="vendor/xterm.js"></script><script src="vendor/addon-fit.js"></script><script>
const terminal = new Terminal({fontFamily:'Cascadia Code, Consolas, monospace', fontSize:13, cursorBlink:true, scrollback:10000, theme:{background:'#18181b',foreground:'#d4d4d8',cursor:'#a78bfa',selectionBackground:'#6750a455',black:'#18181b',red:'#f87171',green:'#4ade80',yellow:'#fbbf24',blue:'#60a5fa',magenta:'#c084fc',cyan:'#22d3ee',white:'#e4e4e7'}});
const fit = new FitAddon.FitAddon(); terminal.loadAddon(fit); terminal.open(document.getElementById('terminal'));
function resize(){try{fit.fit();window.chrome.webview.postMessage({type:'resize',cols:terminal.cols,rows:terminal.rows});}catch{}}
terminal.onData(data=>window.chrome.webview.postMessage({type:'input',data}));
const contexts=[]; let outputDirectory='';
const locationPattern=/(?:[A-Za-z]:[\\/]|\\\\|\.{0,2}[\\/])?[^\r\n<>|"?*]+?\.[A-Za-z0-9]+(?:\(\d+(?:,\d+)?(?:,\d+,\d+)?\)|:\d+(?::\d+)?)/g;
const buildLinkProvider={provideLinks(y,callback){
  const buffer=terminal.buffer.active; let first=y-1,last=y-1;
  while(first>0 && buffer.getLine(first)?.isWrapped)first--;
  while(buffer.getLine(last+1)?.isWrapped)last++;
  let text=''; for(let row=first;row<=last;row++)text+=buffer.getLine(row)?.translateToString(row===last)??'';
  const context=contexts.filter(c=>!c.marker.isDisposed && c.marker.line<=first).at(-1);
  const links=[];
  for(const match of text.matchAll(locationPattern)){
    let start=match.index; while(start<match.index+match[0].length && /\s/.test(text[start]))start++;
    const end=match.index+match[0].length-1;
    if(Math.floor(start/terminal.cols)>y-1-first || Math.floor(end/terminal.cols)<y-1-first)continue;
    links.push({range:{start:{x:start%terminal.cols+1,y:first+Math.floor(start/terminal.cols)+1},end:{x:end%terminal.cols+1,y:first+Math.floor(end/terminal.cols)+1}},text:match[0],activate:()=>window.chrome.webview.postMessage({type:'location',text,directory:context?.directory??outputDirectory})});
  }
  callback(links);
}}; terminal.registerLinkProvider(buildLinkProvider);
// Serialize writes so directory markers are anchored before the corresponding output.
const writes=[];let writing=false;
function drain(){if(writing || !writes.length)return;writing=true;const data=writes.shift();
  if(data.directory!==outputDirectory){outputDirectory=data.directory;const marker=terminal.registerMarker(0);if(marker)contexts.push({marker,directory:outputDirectory});}
  terminal.write(data.data,()=>{for(let i=contexts.length-1;i>=0;i--)if(contexts[i].marker.isDisposed)contexts.splice(i,1);writing=false;drain();});
}
window.chrome.webview.addEventListener('message',({data})=>{if(data.type==='output'){writes.push(data);drain();}if(data.type==='archive'){writes.push({data:'\r\n'.repeat(terminal.rows),directory:outputDirectory});drain();}if(data.type==='clear')terminal.clear();if(data.type==='focus')terminal.focus();});
new ResizeObserver(resize).observe(document.getElementById('terminal')); resize();
window.chrome.webview.postMessage({type:'ready'});
</script></body></html>
